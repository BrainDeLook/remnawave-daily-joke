name: Test and publish add-on images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
  build:
    needs: tests
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Read add-on version
        id: version
        run: |
          VERSION=$(sed -n 's/^version: "\(.*\)"/\1/p' daily_joke/config.yaml)
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./daily_joke
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ghcr.io/braindelook/remnawave-daily-joke-${{ matrix.arch }}:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/BrainDeLook/remnawave-daily-joke
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test native image
        run: |
          IMAGE=ghcr.io/braindelook/remnawave-daily-joke-${{ matrix.arch }}:${{ steps.version.outputs.value }}
          docker run --rm --entrypoint /bin/ollama "$IMAGE" --version
          docker run --rm --entrypoint python "$IMAGE" -c 'import app; print("Python imports OK")'
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/braindelook/remnawave-daily-joke-${{ matrix.arch }}:${{ steps.version.outputs.value }}
