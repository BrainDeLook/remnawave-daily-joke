name: Remnawave Daily Joke
version: "0.1.0"
slug: remnawave_daily_joke
description: Local AI jokes in your Remnawave subscription announce, once a day
url: https://github.com/BrainDeLook/remnawave-daily-joke
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
options:
  panel_url: ""
  api_key: ""
  cookie: ""
  model: "qwen2.5:1.5b"
  daily_time: "09:00"
  timezone: "Europe/Moscow"
  max_chars: 400
  dry_run: true
  examples:
    - "— Почему программист не любит природу? — Слишком много багов."
    - "Купил умную лампочку. Теперь, чтобы посидеть в темноте, приходится обновлять прошивку."
schema:
  panel_url: str
  api_key: password
  cookie: password
  model: "list(qwen2.5:0.5b|qwen2.5:1.5b|qwen2.5:3b)"
  daily_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  timezone: str
  max_chars: "int(80,1000)"
  dry_run: bool
  examples:
    - str
