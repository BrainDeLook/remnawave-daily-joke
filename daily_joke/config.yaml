name: Remnawave Daily Joke
version: "0.1.8"
image: ghcr.io/braindelook/remnawave-daily-joke-{arch}
slug: remnawave_daily_joke
description: Daily AI jokes in Remnawave via local models or Tooken Club API
url: https://github.com/BrainDeLook/remnawave-daily-joke
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:emoticon-happy-outline
options:
  provider: local
  tooken_api_key: ""
  tooken_model: "gpt-6.1-terra"
  panel_url: ""
  api_key: ""
  cookie: ""
  model: "qwen3:4b-instruct"
  daily_time: "09:00"
  timezone: "Europe/Moscow"
  max_chars: 400
  dry_run: true
  example_count: 8
  examples:
    - "— Почему программист не любит природу? — Слишком много багов."
    - "Купил умную лампочку. Теперь, чтобы посидеть в темноте, приходится обновлять прошивку."
schema:
  provider: "list(local|tooken)"
  tooken_api_key: password
  tooken_model: str
  panel_url: str
  api_key: password
  cookie: password
  model: "list(qwen2.5:0.5b|qwen2.5:1.5b|qwen2.5:3b|qwen3:4b-instruct)"
  daily_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  timezone: str
  max_chars: "int(80,1000)"
  dry_run: bool
  example_count: "int(0,10000)"
  examples:
    - str
