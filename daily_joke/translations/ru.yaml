configuration:
  provider:
    name: Способ генерации
    description: local — локальная модель; tooken — платный Tooken Club API без запуска Ollama. После смены перезапустите дополнение.
  tooken_api_key:
    name: API-ключ Tooken Club
    description: Отдельный ключ Tooken Club. Нужен только для provider=tooken; ключ Remnawave остаётся в api_key.
  tooken_model:
    name: Модель Tooken Club
    description: Начальный вариант gpt-6.1-terra; для сравнения gpt-6.1-sol. GPT используют Responses, остальные модели — Chat Completions. ID берите из кабинета или /v1/models.
  panel_url:
    name: Адрес панели или секретная ссылка
    description: HTTPS-адрес своей панели. Можно вставить ссылку /auth/login?ключ=значение, чтобы получить cookie.
  api_key:
    name: API-ключ Remnawave
    description: Нужен доступ на чтение и изменение Subscription Settings.
  cookie:
    name: Cookie защиты (необязательно)
    description: Полная строка имя=значение. Оставьте пустой при использовании секретной ссылки или панели без cookie-защиты.
  model:
    name: Локальная модель
    description: Qwen3 4B Instruct — новый вариант для RPi 5 с 8 ГБ RAM при достаточном запасе памяти. Qwen2.5 0.5B/1.5B/3B — более лёгкие варианты. После смены перезапустите дополнение.
  daily_time:
    name: Время обновления
    description: HH:MM. Если дополнение включено позже этого времени, обновление будет выполнено при запуске.
  timezone:
    name: Часовой пояс
    description: Например Europe/Moscow или Asia/Yekaterinburg.
  max_chars:
    name: Максимальная длина анекдота
  dry_run:
    name: Только предпросмотр
    description: Включено — проверяет доступ и выводит анекдот в журнал, НЕ меняя панель. Выключите после проверки и перезапустите дополнение.
  example_count:
    name: Сколько примеров учитывать
    description: Укажите количество случайных примеров; 0 — использовать все. Больше примеров увеличивает расход токенов и нагрузку на локальную модель.
  examples:
    name: Примеры анекдотов
    description: Примеры стиля, не обучение. В режиме local остаются на устройстве; в режиме tooken отправляются Tooken Club вместе с несколькими недавними анекдотами.
